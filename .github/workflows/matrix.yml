name: matrix-strategy
on: workflow_dispatch
jobs:
    deploy:
        strategy:
            matrix:
                os: [ubuntu-latest, ubuntu-20.04, windows-latest]
                image: [hello-world, alpine]
        
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Docker-Information
                run: docker info
            
            -   name: Run Images
                run: docker run ${{ matrix.image }}
        